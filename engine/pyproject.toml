[project]
name = "finb"
version = "0.1.0"
description = "A farm of competing, continuously-evolved trading strategies. Paper only."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # --- numerics / dataframes ---
    "numpy>=2.1",
    "pandas>=2.2",
    "polars>=1.17",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "scikit-learn>=1.6",

    # --- storage: parquet lake + duckdb query layer ---
    "duckdb>=1.1",
    "pyarrow>=18.0",

    # --- models ---
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "optuna>=4.1",

    # --- market access ---
    "alpaca-py>=0.33",
    "ccxt>=4.4",
    "yfinance>=0.2.50",

    # --- io / net ---
    "httpx>=0.28",
    "websockets>=14.0",
    "tenacity>=9.0",
    "orjson>=3.10",

    # --- config / cli / logging ---
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0",

    # --- scheduling ---
    "apscheduler>=3.11",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.9",
    "plotly>=5.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[project.scripts]
finb = "finb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finb"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
